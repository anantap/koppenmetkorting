name: Refresh productdata

# Periodiek de affiliate-feeds ophalen, src/data/products.json regenereren,
# en bij wijzigingen committen + pushen. Cloudflare Pages pikt de push
# vanzelf op en deployt opnieuw (build command `npm run build`, output dir
# `dist`).
#
# Gebruikt de Bol Marketing API (OAuth client credentials, via BOL_FEED_PATH)
# en de drogist-feeds via TradeTracker/Daisycon/Awin -- die werken allemaal
# over een gewone HTTPS-URL, geen vast IP nodig. (Bol biedt de productfeed
# ook via FTP aan, maar dat vereist een gewhitelist vast IP-adres dat hier
# niet beschikbaar is, dus gebruik de Marketing API.)

on:
  schedule:
    # Elke dag om 04:00 UTC (06:00 NL-tijd in de zomer). Pas aan naar wens.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build productdata vanuit live feeds
        env:
          # Zet deze secrets in Settings -> Secrets and variables -> Actions.
          # Leeg laten = build valt terug op de sample-CSV's in data/sample/.
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          BOL_SITE_ID: ${{ secrets.BOL_SITE_ID }}
          BOL_FEED_PATH: ${{ secrets.BOL_FEED_PATH }}
          FEED_DROGIST_URL: ${{ secrets.FEED_DROGIST_URL }}
          FEED_DROGIST_SUBID: ${{ secrets.FEED_DROGIST_SUBID }}
        run: npm run build:data

      - name: Commit en push als de data gewijzigd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data; then
            echo "Geen wijzigingen in productdata."
            exit 0
          fi
          git add src/data/products.json src/data/meta.json
          git commit -m "chore: refresh productdata"
          git push
